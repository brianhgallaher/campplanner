<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Camp Planner Go</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#262661">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Camp Go">
  <link rel="manifest" href="go.webmanifest">
  <link rel="icon" href="img/go-192.png">
  <link rel="apple-touch-icon" href="img/go-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/go.css?v=20261114h">
</head>
<body>
  <header class="go-head">
    <b id="goTitle">Camp Planner Go</b>
    <span id="goNet" class="go-net"></span>

  <main id="goMain"></main>

  <nav class="go-nav" id="goNav" hidden>
    <button data-tab="plan" class="on"><span>🗓</span>Plan</button>

    <button data-tab="help"><span>🆘</span>Emergency</button>
    <button data-tab="share"><span>📣</span>Status</button>
  </nav>

  <div id="goToast" class="go-toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/geo.js?v=20261114h"></script>
  <script src="js/go.js?v=20261114h"></script>

</html>
